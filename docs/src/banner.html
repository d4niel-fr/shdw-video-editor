<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(Geist.ttf)}@font-face{font-family:GM;src:url(GeistMono.ttf)}
html,body{margin:0;background:#0a0a0b}
.b{position:relative;width:1600px;height:640px;overflow:hidden;background:#0a0a0b;font-family:G;color:#f5f5f7}
.b::before{content:"";position:absolute;inset:0;opacity:.10;background-image:radial-gradient(#fff 1.1px,transparent 1.4px);background-size:24px 24px}
.glow{position:absolute;left:-200px;top:-260px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(10,132,255,.22),transparent)}
.txt{position:absolute;left:96px;top:120px;width:640px}
.eb{font-family:GM;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#a1a1aa;display:flex;gap:14px;align-items:center}
.eb i{width:30px;height:2px;background:#0a84ff;display:block}
h1{font-size:168px;font-weight:700;letter-spacing:-.055em;line-height:.9;margin:22px 0 0}
h1 u{text-decoration:none;display:inline-block;box-shadow:inset 0 -10px 0 #0a84ff;padding-bottom:4px}
p{font-size:30px;line-height:1.3;letter-spacing:-.015em;color:#d4d4d8;margin:34px 0 0}
p b{color:#fff;font-weight:600}
.chips{display:flex;gap:10px;margin-top:34px;font-family:GM;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.chips span{padding:9px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px #27272a;color:#d4d4d8;background:#141417}
.shot{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 40px 90px -20px #000}
.shot img{display:block;width:100%}
.s1{left:800px;top:70px;width:900px;transform:perspective(1800px) rotateY(-16deg) rotateX(6deg)}
.s2{left:1010px;top:330px;width:640px;transform:perspective(1800px) rotateY(-16deg) rotateX(6deg)}
