[package]
name = "shdw"
version = "1.0.0"
edition = "2021"
description = "shdw — AI-native video editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tiny_http = "0.12"
tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
