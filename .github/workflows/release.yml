name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "shdw v__VERSION__"
          releaseBody: |
            ## Download

            | Platform | File |
            | --- | --- |
            | **Windows 10/11** | `shdw_x.y.z_x64-setup.exe` (recommended) or `.msi` |
            | **macOS 11+ (Apple Silicon & Intel)** | `shdw_x.y.z_universal.dmg` |

            **macOS:** the app is not notarized yet. After dragging it to Applications, run once:
            `xattr -cr /Applications/shdw.app` — then open it normally.

            **You also need:** FFmpeg, a Chromium browser (Edge/Chrome — Edge ships with Windows), and the `claude` (Claude Code) and/or `codex` CLI, logged in.
            See the [README](https://github.com/d4niel-fr/shdw-video-editor#-quick-start) for one-line installs.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
